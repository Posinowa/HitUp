plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.posinowa.hitup"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.posinowa.hitup"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // An explicit literal on purpose, never flutter.minSdkVersion. The
        // supported Android floor is visible to users: raising it stops
        // updates reaching devices below it, so it has to be a change someone
        // makes and a reviewer sees, not something a Flutter SDK upgrade does
        // on its own.
        //
        // 24 is what flutter_local_notifications 22.3.0 requires; it declares
        // minSdkVersion 24 in its own Gradle config and will not link below
        // it, so HIT-057 cannot ship without this floor. The previous value of
        // 23 was set for the Firebase client SDKs, and 24 clears that too.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
