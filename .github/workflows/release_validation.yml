name: Release Validation

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Flutter version comes from `.fvmrc`, the same file flutter_ci.yml reads.
# Two copies of a version number are two chances to disagree, and the way they
# disagree here is quiet: pull requests would go green on one SDK while release
# validation ran on another, so the first failure would appear on a release
# pull request and look like the release changed something.
#
# `release-metadata` runs the same check flutter_ci does. On pull requests the
# merge is already blocked by `repository-policy`, which is a required status
# check in both rulesets; `release-metadata` is not, so it gates nothing on its
# own. This call exists for `v*` tags, where nothing else runs the check and a
# tag can be created on any commit, including one that never went through
# flutter_ci.
#
# It runs alongside the build jobs rather than ahead of them, so a broken file
# turns the run red rather than skipping the builds.

jobs:
  release-metadata:
    name: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the pinned Flutter version
        # Also run by flutter_ci.yml. The reasoning lives in the script.
        run: bash .github/scripts/check-flutter-version.sh
      - name: Write build metadata
        run: |
          set -euo pipefail
          {
            echo "repository=${{ github.repository }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "event=${{ github.event_name }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Credential-free validation only. No App Store / Play Store publishing."
          } > release-metadata.txt
          cat release-metadata.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata.txt
          retention-days: 14

  release-android:
    name: release-android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release mode, not debug. R8 minification and tree shaking only run in
      # a release build, so missing keep rules and tree-shaking casualties
      # cannot surface in a debug one. Building debug here meant the release
      # line never compiled the way a shipped build compiles, and the first
      # signal would have been a failed store upload on release day.
      #
      # No signing material is introduced: with no keystore configured Gradle
      # falls back to the debug signing config. The artifact is not
      # shippable, but the compilation path is the real one, which is the
      # point of validation.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk-unsigned-validation-only
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 7

  release-ios:
    name: release-ios-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      # Release configuration, still unsigned. A simulator build skips the
      # release compilation path in the same way a debug APK does.
      - run: flutter build ios --release --no-codesign
