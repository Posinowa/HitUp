name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate repository policy
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Forbidden custom-server directories at repo root
          for d in backend server functions cloud-functions; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden server directory detected: $d/"
              fail=1
            fi
          done

          # Branch naming for feature PRs into develop (advisory hard-fail for clearly wrong targets is handled by branch-policy on main)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            head="${{ github.head_ref }}"
            echo "PR base=$base head=$head"
            if [ "$base" = "develop" ]; then
              case "$head" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|chore/github-governance) ;;
                develop|main)
                  echo "::error::Invalid head branch for develop PR: $head"
                  fail=1
                  ;;
                *)
                  echo "::warning::Unusual branch name '$head'. Prefer feature/HIT-XXX-description"
                  ;;
              esac
            fi
          fi

          exit "$fail"

  secret-guard:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for forbidden credential-like paths
        shell: bash
        run: |
          set -euo pipefail
          # Report paths only — never print file contents
          mapfile -t hits < <(
            find . -type f \
              ! -path './.git/*' \
              ! -path './build/*' \
              ! -path './.dart_tool/*' \
              \( \
                -name '.env' -o \
                -name '.env.*' -o \
                -name '*.p8' -o \
                -name '*.p12' -o \
                -name '*.pfx' -o \
                -name '*.jks' -o \
                -name '*.keystore' -o \
                -name 'service-account*.json' -o \
                -name 'firebase-admin*.json' -o \
                -name '*-firebase-adminsdk-*.json' \
              \) 2>/dev/null | sed 's|^\./||' || true
          )

          # Allow documented example only
          filtered=()
          for f in "${hits[@]:-}"; do
            [ -z "$f" ] && continue
            if [ "$f" = ".env.example" ]; then
              continue
            fi
            filtered+=("$f")
          done

          if [ "${#filtered[@]}" -gt 0 ]; then
            for f in "${filtered[@]}"; do
              echo "::error::Forbidden credential-like file detected: $f"
            done
            exit 1
          fi
          echo "No forbidden credential-like files detected."

      - name: Scan file contents for credential patterns
        shell: bash
        run: |
          set -uo pipefail

          # The step above matches file NAMES. It catches a committed key file
          # and nothing else. An R2 access key pasted into a Dart constant
          # passes it untouched, which is the case SECURITY.md and the PR
          # template both call out by name. Filename checking and content
          # checking are two different controls; this is the second one.
          allowlist='.github/secret-scan-allowlist.txt'

          # Each entry is a label and a pattern. Labels are what reach the log,
          # never the match itself.
          patterns=(
            'AWS/R2 style access key id|AKIA[0-9A-Z]{16}'
            'Google API key|AIza[0-9A-Za-z_-]{35}'
            'PEM private key block|-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'Firebase Admin service account marker|"type"[[:space:]]*:[[:space:]]*"service_account"'
            'Slack token|xox[baprs]-[0-9A-Za-z-]{10,}'
            'Generic assigned secret|(secret|password|passwd|token|apikey|api_key)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9/+=_-]{24,}["'"'"']'
          )

          fail=0
          for entry in "${patterns[@]}"; do
            label="${entry%%|*}"
            regex="${entry#*|}"
            while IFS= read -r hit; do
              [ -z "$hit" ] && continue
              file="${hit%%:*}"
              line="$(echo "$hit" | cut -d: -f2)"
              if [ -f "$allowlist" ] && grep -qxF "${file}:${line}" "$allowlist"; then
                echo "::notice::Reviewed false positive: ${file}:${line}"
                continue
              fi
              # File and line only. The matched text is never printed, because
              # a workflow log is readable by anyone who can see the run.
              #
              # The pattern is passed with -e on purpose: the PEM one starts
              # with dashes, and without -e grep reads it as options and
              # searches for nothing at all, silently, while still exiting 0.
              echo "::error file=${file},line=${line}::Possible credential in source: ${label}. If this is a false positive, add ${file}:${line} to ${allowlist} with the reason in the pull request."
              fail=1
            done < <(
              grep -rnE --binary-files=without-match                 --exclude-dir=.git --exclude-dir=build --exclude-dir=.dart_tool                 --exclude="$(basename "$allowlist")"                 -e "$regex" . 2>/dev/null | sed 's|^\./||' | cut -d: -f1,2 || true
            )
          done

          if [ "$fail" -eq 0 ]; then
            echo "No credential patterns found in file contents."
          fi
          exit "$fail"

  flutter-format:
    name: flutter-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: flutter-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (unsigned verification)
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 5

  ios-build:
    name: ios-build
    runs-on: macos-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS simulator (no signing)
        run: flutter build ios --simulator --no-codesign
