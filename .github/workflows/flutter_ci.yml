name: Flutter CI

on:
  pull_request:
    # `edited` matters: the check has to re-run when someone fixes the title,
    # otherwise the only way to clear a red check is an empty commit.
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Repository settings squash-merge with squash_merge_commit_title:
          # PR_TITLE, so this string becomes the commit message on develop
          # verbatim. Nothing else checks it.
          pattern='^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)(\([a-z0-9._-]+\))?: .+( \[HIT-[0-9]+\])?$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Title matches the commit convention."
            exit 0
          fi

          echo "::error::Pull request title does not match the commit convention documented in CONTRIBUTING.md."
          echo ""
          echo "  Received: $PR_TITLE"
          echo ""
          echo "  Expected: type(optional-scope): summary [HIT-XXX]"
          echo "  Types:    feat, fix, chore, docs, refactor, test, perf, build, ci, revert"
          echo "  The scope is optional, and so is the trailing backlog ID."
          echo ""
          echo "  For example:"
          echo "    feat(auth): add registration screen [HIT-017]"
          echo "    fix(progress): handle streak rollover [HIT-054]"
          echo "    docs: update architecture guide"
          echo ""
          echo "  Edit the title on the pull request; this check re-runs on edit."
          exit 1

  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate repository policy
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Forbidden custom-server directories at repo root
          for d in backend server functions cloud-functions; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden server directory detected: $d/"
              fail=1
            fi
          done

          # Branch naming for feature PRs into develop (advisory hard-fail for clearly wrong targets is handled by branch-policy on main)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            head="${{ github.head_ref }}"
            echo "PR base=$base head=$head"
            if [ "$base" = "develop" ]; then
              case "$head" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|chore/github-governance) ;;
                develop|main)
                  echo "::error::Invalid head branch for develop PR: $head"
                  fail=1
                  ;;
                *)
                  echo "::warning::Unusual branch name '$head'. Prefer feature/HIT-XXX-description"
                  ;;
              esac
            fi
          fi

          exit "$fail"

  secret-guard:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for forbidden credential-like paths
        shell: bash
        run: |
          set -euo pipefail
          # Report paths only — never print file contents
          mapfile -t hits < <(
            find . -type f \
              ! -path './.git/*' \
              ! -path './build/*' \
              ! -path './.dart_tool/*' \
              \( \
                -name '.env' -o \
                -name '.env.*' -o \
                -name '*.p8' -o \
                -name '*.p12' -o \
                -name '*.pfx' -o \
                -name '*.jks' -o \
                -name '*.keystore' -o \
                -name 'service-account*.json' -o \
                -name 'firebase-admin*.json' -o \
                -name '*-firebase-adminsdk-*.json' \
              \) 2>/dev/null | sed 's|^\./||' || true
          )

          # Allow documented example only
          filtered=()
          for f in "${hits[@]:-}"; do
            [ -z "$f" ] && continue
            if [ "$f" = ".env.example" ]; then
              continue
            fi
            filtered+=("$f")
          done

          if [ "${#filtered[@]}" -gt 0 ]; then
            for f in "${filtered[@]}"; do
              echo "::error::Forbidden credential-like file detected: $f"
            done
            exit 1
          fi
          echo "No forbidden credential-like files detected."

  flutter-format:
    name: flutter-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: flutter-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (unsigned verification)
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 5

  ios-build:
    name: ios-build
    runs-on: macos-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS simulator (no signing)
        run: flutter build ios --simulator --no-codesign
