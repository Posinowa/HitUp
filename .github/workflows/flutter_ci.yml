name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate repository policy
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Forbidden custom-server directories at repo root
          for d in backend server functions cloud-functions; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden server directory detected: $d/"
              fail=1
            fi
          done

          # Branch naming for feature PRs into develop (advisory hard-fail for clearly wrong targets is handled by branch-policy on main)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            head="${{ github.head_ref }}"
            echo "PR base=$base head=$head"
            if [ "$base" = "develop" ]; then
              case "$head" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|chore/github-governance) ;;
                develop|main)
                  echo "::error::Invalid head branch for develop PR: $head"
                  fail=1
                  ;;
                *)
                  echo "::warning::Unusual branch name '$head'. Prefer feature/HIT-XXX-description"
                  ;;
              esac
            fi
          fi

          exit "$fail"

  secret-guard:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for forbidden credential-like paths
        shell: bash
        run: |
          set -euo pipefail
          # Report paths only — never print file contents
          mapfile -t hits < <(
            find . -type f \
              ! -path './.git/*' \
              ! -path './build/*' \
              ! -path './.dart_tool/*' \
              \( \
                -name '.env' -o \
                -name '.env.*' -o \
                -name '*.p8' -o \
                -name '*.p12' -o \
                -name '*.pfx' -o \
                -name '*.jks' -o \
                -name '*.keystore' -o \
                -name 'service-account*.json' -o \
                -name 'firebase-admin*.json' -o \
                -name '*-firebase-adminsdk-*.json' \
              \) 2>/dev/null | sed 's|^\./||' || true
          )

          # Allow documented example only
          filtered=()
          for f in "${hits[@]:-}"; do
            [ -z "$f" ] && continue
            if [ "$f" = ".env.example" ]; then
              continue
            fi
            filtered+=("$f")
          done

          if [ "${#filtered[@]}" -gt 0 ]; then
            for f in "${filtered[@]}"; do
              echo "::error::Forbidden credential-like file detected: $f"
            done
            exit 1
          fi
          echo "No forbidden credential-like files detected."

  flutter-format:
    name: flutter-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: flutter-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (unsigned verification)
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 5

  ios-build:
    name: ios-build
    runs-on: macos-latest
    needs: [flutter-analyze, flutter-test]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS simulator (no signing)
        run: flutter build ios --simulator --no-codesign
