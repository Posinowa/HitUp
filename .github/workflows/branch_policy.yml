name: Branch Policy

on:
  pull_request:
    branches: [main]

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main source-branch policy
        shell: bash
        # Branch names come in through env, not as expressions inside run.
        # GitHub pastes an expression into the script text before bash parses
        # it, and the head branch is named by whoever opens the pull request,
        # so a name like x";exit${IFS}0;" would run as code and pass this check.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          base="$BASE_REF"
          head="$HEAD_REF"
          echo "Evaluating PR: $head → $base"

          if [ "$base" != "main" ]; then
            echo "Not targeting main; nothing to enforce."
            exit 0
          fi

          case "$head" in
            develop)
              echo "Allowed: develop → main (release)"
              exit 0
              ;;
            hotfix/*)
              echo "Allowed: hotfix/* → main (emergency)"
              exit 0
              ;;
            *)
              echo "::error::PRs into main must come from 'develop' (release) or 'hotfix/*' (emergency). Got head='$head'."
              exit 1
              ;;
          esac
