version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: infrastructure"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: infrastructure"
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch
