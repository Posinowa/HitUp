name: hitup
description: HitUp — guided daily diction, articulation, breathing and public-speaking trainer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management & DI (LOCKED decision — HIT-005)
  flutter_riverpod: ^2.6.1

  # Routing (LOCKED decision — HIT-006)
  go_router: ^18.0.0

  # Firebase client services only — NO custom backend / NO Cloud Functions
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0

  # Local preferences (onboarding flags, etc.)
  shared_preferences: ^2.5.5

  # Exercise animations (prefer local .riv assets for MVP)
  rive: ^0.14.11

  # Daily reminders, on-device only (HIT-057). No Firebase Cloud Messaging and
  # no server: the reminder is scheduled by the device for the device.
  # timezone + flutter_timezone are not optional extras here; scheduling at a
  # local wall-clock time requires a real timezone database, see
  # docs/architecture/NOTIFICATIONS.md.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo/
    - assets/branding/icons/
    - assets/content/
    - assets/rive/
    - assets/audio/
    - assets/images/
    - assets/illustrations/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
